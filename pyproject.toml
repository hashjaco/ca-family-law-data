[project]
name = "ca-family-law-data"
version = "0.1.0"
description = "Ingestion pipeline for California family-law statewide + county local rules"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "anthropic>=0.40",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
