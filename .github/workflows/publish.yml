# Publish on merge to main: artifacts to R2, corpus to D1, Worker to the edge.
name: publish
on:
  push:
    branches: [main]
    paths: ["data/**", "schema/**", "scripts/build.py", "api/**"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync

      - name: Build
        id: build
        run: |
          VERSION="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          uv run python scripts/build.py --version "$VERSION" --base-url "${{ vars.CORPUS_BASE_URL }}"

      # Immutable, content-addressed source archive plus the current artifacts.
      # R2 free tier: 10 GB storage, free egress.
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in dist/*; do
            npx wrangler@4 r2 object put "ca-family-law/$(basename "$f")" --file "$f" --remote
          done

      - name: Import corpus into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # D1 free tier allows 100k row writes/day; the corpus is well under that,
        # but a full re-import of all 58 counties should be watched.
        run: npx wrangler@4 d1 execute ca-family-law --remote --file=dist/corpus.sql --yes

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm ci --prefix api && npx --prefix api wrangler deploy --config api/wrangler.toml

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: corpus-v${{ steps.build.outputs.version }}
          files: dist/*
          generate_release_notes: true
