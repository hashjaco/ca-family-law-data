# Structured extraction. Manual by design: it spends money and should follow a
# reviewed crawl diff rather than fire on a schedule.
name: extract
on:
  workflow_dispatch:
    inputs:
      counties:
        description: "Space-separated county slugs"
        required: true
      limit:
        description: "Only the first N rules per county (smoke test)"
        required: false
      force:
        description: "Re-extract rules already done"
        type: boolean
        default: false

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Extract requirements
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL || 'claude-sonnet-5' }}
          # Passed as environment values, never interpolated into the script
          # body: `${{ inputs.x }}` inside `run:` is substituted before the shell
          # sees it, so a crafted dispatch input becomes executable text.
          COUNTIES: ${{ inputs.counties }}
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=()
          [ "$FORCE" = "true" ] && args+=(--force)
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          # $COUNTIES is intentionally unquoted to split the slug list into
          # arguments; shell metacharacters in it stay inert as argument text.
          uv run python scripts/extract.py "${args[@]}" $COUNTIES

      - name: Validate
        run: uv run python scripts/validate.py

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: corpus/extract-${{ github.run_id }}
          title: "corpus: extract requirements"
          commit-message: "corpus: extract requirements"
          labels: corpus, needs-review
          body: |
            Model-extracted requirements for: `${{ inputs.counties }}`

            Every record lands as `needs_review`. Check each requirement's
            `source_quote` against the cited rule before promoting it to
            `verified` — `validate.py` proves the quote is verbatim, not that
            the requirement it states is the right reading of it.
